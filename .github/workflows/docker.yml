name: docker

# Runs only when started manually. Builds the five images, pushes them to Amazon
# ECR with the tag provided at dispatch time, then runs an Amazon Inspector scan
# on each pushed image and stores the findings as workflow artifacts.
#
# Secrets:
#   CIRCLE_TOKEN   reads the Enterprise build artifacts from CircleCI
#   AWS_ROLE_ARN   IAM role assumed through GitHub OIDC (no long-lived AWS keys)
#
# The Enterprise build is selected automatically from the current branch
# (see the "Resolve target workflow" step).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 6.15.0). Each image gets "<tag>-<name>".
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
  CIRCLE_BRANCH: ${{ github.ref_name }}
  IMAGE_TAG: ${{ inputs.tag }}
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sensu/sensu

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate image tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Docker tag rules: up to 128 chars, [A-Za-z0-9_.-], must not start with . or -
          if ! printf '%s' "${TAG}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Invalid image tag: '${TAG}'" >&2
            exit 1
          fi
          echo "Publishing image tag: ${TAG}"

  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target_workflow: ${{ steps.resolve.outputs.target_workflow }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target workflow
        id: resolve
        # Same mapping as CircleCI setenv-target-workflow: develop/*, release/*
        # and main use the same Enterprise branch; anything else uses develop/6.
        # The latest successful "build" workflow on that branch is selected.
        run: |
          case "${CIRCLE_BRANCH}" in
            develop/* | release/* | main) branch="${CIRCLE_BRANCH}" ;;
            *) branch="develop/6" ;;
          esac
          echo "Using Enterprise artifact branch: ${branch}"
          workflow="$(TARGET_BRANCH="${branch}" ./scripts/find-branch-workflow.sh)"
          if [ -z "${workflow}" ]; then
            echo "TARGET_WORKFLOW is empty" >&2
            exit 1
          fi
          echo "TARGET_WORKFLOW: ${workflow}"
          echo "target_workflow=${workflow}" >> "${GITHUB_OUTPUT}"

  build-docker:
    needs: [validate-input, resolve-target]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine
            path: dockerfiles/alpine
            platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
            prepare: all
          - name: rhel7
            path: dockerfiles/redhat7
            platforms: linux/amd64
            prepare: amd64
          - name: rhel8
            path: dockerfiles/ubi8
            platforms: linux/amd64
            prepare: amd64
          - name: rhel9
            path: dockerfiles/ubi9
            platforms: linux/amd64
            prepare: amd64
          - name: rhel10
            path: dockerfiles/ubi10
            platforms: linux/amd64
            prepare: amd64
    env:
      TARGET_WORKFLOW: ${{ needs.resolve-target.outputs.target_workflow }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Writes target/ and exports SENSU_VERSION, BUILD_NUMBER, TARGET_REVISION,
      # TARGET_BRANCH_NO_SLASHES and CIRCLE_BRANCH_NO_SLASHES to GITHUB_ENV.
      - name: Prepare target directory
        run: ./scripts/prepare-docker-target.sh ${{ matrix.prepare }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          # One tag per image: "<tag>-<name>", e.g. 6.15.0-alpine.
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-${{ matrix.name }}
          labels: |
            version=${{ env.SENSU_VERSION }}
            release=${{ env.BUILD_NUMBER }}

  scan-images:
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: [alpine, rhel7, rhel8, rhel9, rhel10]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for Inspector scan
        # Inspector scans ECR images automatically (the registry uses enhanced
        # scanning with CONTINUOUS_SCAN), so this step waits for coverage to
        # become ACTIVE rather than starting a scan.
        env:
          IMAGE: ${{ env.IMAGE_TAG }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE}" --query 'imageDetails[0].imageDigest' --output text)"
          echo "Image: ${ECR_REPOSITORY}:${IMAGE} digest ${digest}"

          filter="{\"resourceType\":[{\"comparison\":\"EQUALS\",\"value\":\"AWS_ECR_CONTAINER_IMAGE\"}],\"ecrRepositoryName\":[{\"comparison\":\"EQUALS\",\"value\":\"${ECR_REPOSITORY}\"}]}"
          deadline=$((SECONDS + 1800))
          while true; do
            statuses="$(aws inspector2 list-coverage --filter-criteria "${filter}" --output json \
              | jq -r --arg d "${digest}" '[.coveredResources[] | select(.resourceId | contains($d)) | .scanStatus.statusCode] | .[]')"
            echo "$(date +%H:%M:%S) coverage: $(echo "${statuses:-none}" | tr '\n' ' ')"
            if echo "${statuses}" | grep -Eq 'SCANNING_FAILED|UNSUPPORTED_IMAGE'; then
              echo "Inspector could not scan ${IMAGE}" >&2
              exit 1
            fi
            if [ -n "${statuses}" ] && ! echo "${statuses}" | grep -qv '^ACTIVE$'; then
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Timed out waiting for Inspector scan of ${IMAGE}" >&2
              exit 1
            fi
            sleep 30
          done

      - name: Fetch Inspector findings
        env:
          IMAGE: ${{ env.IMAGE_TAG }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p scan-results
          filter="{\"ecrImageRepositoryName\":[{\"comparison\":\"EQUALS\",\"value\":\"${ECR_REPOSITORY}\"}],\"ecrImageTags\":[{\"comparison\":\"EQUALS\",\"value\":\"${IMAGE}\"}]}"
          aws inspector2 list-findings --filter-criteria "${filter}" --max-items 5000 --output json \
            > "scan-results/${IMAGE}-findings.json"

      - name: Build report table
        env:
          IMAGE: ${{ env.IMAGE_TAG }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          ./scripts/inspector-report.sh \
            "scan-results/${IMAGE}-findings.json" \
            "Inspector scan: ${ECR_REPOSITORY}:${IMAGE}" \
            "scan-results"
          cat "scan-results/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: inspector-${{ env.IMAGE_TAG }}-${{ matrix.name }}
          path: scan-results/
          retention-days: 90
